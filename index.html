<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#060708">
  <meta name="description" content="Explore a lensed black hole and an impossible lattice in real time.">
  <title>Interstellar — Gargantua &amp; Tesseract</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
    {"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}
  </script>
</head>
<body>
  <main id="viewport" aria-label="Interactive 3D observatory"></main>
  <div class="frame">
    <header class="chrome">
      <a class="wordmark" href="#gargantua" aria-label="Interstellar, return to Gargantua">
        <svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="7"/><ellipse cx="14" cy="14" rx="13" ry="3.8" transform="rotate(-28 14 14)"/><path d="M14 11.6v4.8m-2.4-2.4h4.8"/></svg>
        <span>INTERSTELLAR</span>
      </a>
      <div class="tools">
        <button type="button" id="pause" class="icon" aria-label="Pause motion" aria-pressed="false" title="Pause motion (Space)">
          <svg class="pause-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14m6-14v14"/></svg>
          <svg class="play-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 11 7-11 7z"/></svg>
        </button>
        <button type="button" id="reset" class="icon" aria-label="Reset camera" title="Reset camera (R)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1.5 7M4 5v5h5"/></svg>
        </button>
        <button type="button" id="fullscreen" class="icon" aria-label="Enter fullscreen" aria-pressed="false" title="Fullscreen (F)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg>
        </button>
      </div>
    </header>
    <footer class="chrome">
      <div class="guide" aria-hidden="true"><span id="interaction-hint">Drag to orbit <i></i> Scroll to zoom</span></div>
      <nav aria-label="Scenes" class="scenes">
        <button type="button" data-scene="gargantua" aria-pressed="true">Gargantua</button>
        <button type="button" data-scene="tesseract" aria-pressed="false">Tesseract</button>
      </nav>
      <div class="settings-wrap">
        <button type="button" id="settings" class="icon" aria-label="Camera and quality settings" aria-expanded="false" aria-controls="panel" title="Camera and quality">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h4m4 0h8M4 12h9m4 0h3M4 18h3m4 0h9M8 4v4m9 2v4m-10 2v4"/></svg>
        </button>
        <section id="panel" aria-label="Camera and quality settings" hidden>
          <label for="camera-mode">Camera</label>
          <select id="camera-mode"><option value="orbit">Orbit</option><option value="flight">Free flight</option></select>
          <label for="quality">Quality</label>
          <select id="quality"><option value="auto">Auto</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select>
          <label for="speed">Speed <output id="speed-value" for="speed">1.0×</output></label>
          <input id="speed" type="range" min="0.25" max="4" step="0.25" value="1">
          <p>WASD move · Q / E descend / ascend</p>
          <p>V switches camera · 1 / 2 switch scene</p>
          <button type="button" id="hide" class="text-button">Hide interface <kbd>H</kbd></button>
        </section>
      </div>
    </footer>
  </div>
  <div id="loading" role="status">Opening observatory</div>
  <div id="error" role="alert" hidden></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
